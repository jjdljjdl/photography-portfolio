<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography Portfolio</title>
        <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Current Selection </h1>
        <p>Joost de Leeuw  </p>
        <a href="https://www.instagram.com/amsterdamadventure/"
       class="instagram-link"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
        <img src="images/instagram.svg" alt="Instagram">
    </a>
    </header>
    <main class="photo-floor">
        <img class="photo photo" src="images/thumbnails/photo1.jpg" data-full="images/full/photo1.jpg" alt="Westerpark">
        <img class="photo photo" src="images/thumbnails/photo2.jpg" data-full="images/full/photo2.jpg" alt="De Spuyt">
        <img class="photo photo" src="images/thumbnails/photo3.jpg" data-full="images/full/photo3.jpg" alt="Svalbard, Arctic Fox">
        <img class="photo photo" src="images/thumbnails/photo4.jpg" data-full="images/full/photo4.jpg" alt="Svalbard, Portrait">
        <img class="photo photo" src="images/thumbnails/photo5.jpg" data-full="images/full/photo5.jpg" alt="Biesbosch, Marina">
        <img class="photo photo" src="images/thumbnails/photo6.jpg" data-full="images/full/photo6.jpg" alt="Hoorn">
        <img class="photo photo" src="images/thumbnails/photo7.jpg" data-full="images/full/photo7.jpg" alt="Sète">
        <img class="photo photo" src="images/thumbnails/photo8.jpg" data-full="images/full/photo8.jpg" alt="Sète">
        <img class="photo photo" src="images/thumbnails/photo9.jpg" data-full="images/full/photo9.jpg" alt="Sète">



    </main>
    <div class="lightbox" id="lightbox">
    <button
        class="lightbox-close"
        id="lightbox-close"
        aria-label="Close"
    >
        ×
    </button>

    <button
        class="lightbox-arrow lightbox-previous"
        id="lightbox-previous"
        aria-label="Previous photo"
    >
        ‹
    </button>

    <img
        class="lightbox-image"
        id="lightbox-image"
        src=""
        alt=""
    >

    <button
        class="lightbox-arrow lightbox-next"
        id="lightbox-next"
        aria-label="Next photo"
    >
        ›
    </button>
</div>
    <script src="script.js"></script>

</body>
</html>
